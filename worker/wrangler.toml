name = "email-ingest"
main = "worker.js"
compatibility_date = "2024-09-01"
# Email-triggered worker: no HTTP route, no workers.dev subdomain needed.
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "email-raw"
database_id = "8fca9a3d-2f46-4c08-a773-46d8e53528b3"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-ingest-queue"
