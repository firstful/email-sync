name = "email-ingest"
main = "worker.js"
compatibility_date = "2024-09-01"
# Email-triggered worker: no HTTP route, no workers.dev subdomain needed.
workers_dev = false

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "ffilt-us-email-raw"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-ingest-queue"
